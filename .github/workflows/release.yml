name: Release
# Uses no third-party actions (only git, go and gh that ship with the runner),
# so it also works when the repository only allows local actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.0.0)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GOTOOLCHAIN: auto # fetch the Go version go.mod asks for
    steps:
      - name: Check out the commit being released
        run: |
          git init -q .
          git fetch -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Go version
        run: go version
      - name: Test
        run: go vet ./... && go test -race ./...
      - name: Install NSIS (Windows installer builder)
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Build artifacts
        run: ./build.sh "$TAG"
      - name: Publish GitHub release
        run: |
          notes=".github/release-notes/${TAG}.md"
          [ -f "$notes" ] || notes=""
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -n "$notes" ]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "AATMT $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "AATMT $TAG" --generate-notes
          fi
